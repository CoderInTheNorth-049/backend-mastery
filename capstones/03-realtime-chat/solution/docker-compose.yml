services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      # Fresh volumes auto-apply db/migrations/*.sql on first init.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      PORT: "3003"
      TOKEN_SECRET: change-me-in-prod
      DATABASE_URL: postgres://postgres:postgres@db:5432/chat
      LOG_LEVEL: info
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
